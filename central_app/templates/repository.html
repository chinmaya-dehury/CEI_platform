<!doctype html>

<html>
  <head>
    <title>Central Repository</title>

    <style>
      body {
        font-family: Arial;
        margin: 30px;
        background: #f5f5f5;
      }

      .agent-card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 25px;
        box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
      }

      .intel-card {
        border: 1px solid #ddd;
        padding: 15px;
        margin-top: 15px;
        border-radius: 8px;
        background: #fafafa;
      }

      h1 {
        color: #333;
      }

      h2 {
        color: #0066cc;
      }

      p {
        margin: 6px 0;
      }

      .toolbar {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      .toolbar input,
      .toolbar select {
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 6px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
      }

      th,
      td {
        border: 1px solid #ddd;
        padding: 10px;
        text-align: left;
        vertical-align: top;
      }

      th {
        background: #007bff;
        color: white;
      }

      tr:nth-child(even) {
        background: #f8f8f8;
      }

      .details {
        font-size: 13px;
        line-height: 1.5;
      }

      pre {
        margin: 0;
        white-space: pre-wrap;
      }
      .modal {
        display: none;
        position: fixed;
        z-index: 9999;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;

        background: rgba(0, 0, 0, 0.5);
      }

      .modal-content {
        background: white;
        width: 700px;
        max-width: 90%;
        margin: 8% auto;
        padding: 25px;
        border-radius: 10px;
        position: relative;
      }

      .close-btn {
        position: absolute;
        right: 15px;
        top: 10px;
        font-size: 28px;
        cursor: pointer;
        font-weight: bold;
      }

      .close-btn:hover {
        color: red;
      }
    </style>
  </head>

  <body>
    <div
      style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px"
    >
      <a
        href="/"
        style="
          background: #007bff;
          color: white;
          padding: 10px 15px;
          border-radius: 8px;
          text-decoration: none;
          font-weight: bold;
        "
      >
        ← Back
      </a>

      <h1 style="margin: 0">Central Intelligence Repository</h1>
    </div>

    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Search..." />

      <select id="agentFilter">
        <option value="">All Agents</option>

        {% for item in repository %}
        <option value="{{ item.agent_name }}">{{ item.agent_name }}</option>
        {% endfor %}
      </select>
    </div>

    <table id="repositoryTable">
      <thead>
        <tr>
          <th>Intelligence ID</th>
          <th>Description</th>
          <th>Agent Name</th>
          <th>Details</th>
        </tr>
      </thead>

      <tbody>
        {% for item in repository %} {% for intel in item.created_intelligence
        %}

        <tr>
          <td>
            <a
              target="_blank"
              href="http://localhost:{{ item.port }}/intelligence/{{ intel.intelligence_id or intel.uuid }}"
            >
              {{ (intel.intelligence_id or intel.uuid)[:4] }}
            </a>
          </td>
          <td
            class="description-cell"
            data-id="{{ intel.intelligence_id or intel.uuid }}"
          >
            <a
              target="_blank"
              href="http://localhost:{{ item.port }}/intelligence/{{ intel.intelligence_id or intel.uuid }}"
            >
              {{ intel.description }}
            </a>
          </td>

          <td>{{ item.agent_name }}</td>
          <td>
            <button
              data-implementation="{{ intel.implementation_path }}"
              data-extension="{{ intel.extension or 'py' }}"
              data-engine="{{ intel.engine or 'n/a' }}"
              data-version="{{ intel.version or 'n/a' }}"
              data-created="{{ intel.created_at }}"
              onclick="showDetailsFromButton(this)"
            >
              View Details
            </button>
          </td>
        </tr>

        {% endfor %} {% endfor %}
      </tbody>
    </table>
    <div id="detailsModal" class="modal">
      <div class="modal-content">
        <span class="close-btn" onclick="closeDetails()">&times;</span>
        <div id="detailsContent"></div>
      </div>
    </div>
    <script>
      document
        .getElementById("searchInput")
        .addEventListener("keyup", filterRows);

      document
        .getElementById("agentFilter")
        .addEventListener("change", filterRows);

      function filterRows() {
        const search = document
          .getElementById("searchInput")
          .value.toLowerCase();

        const agent = document
          .getElementById("agentFilter")
          .value.toLowerCase();

        document
          .querySelectorAll("#repositoryTable tbody tr")
          .forEach((row) => {
            const text = row.innerText.toLowerCase();

            const agentName = row.cells[2].innerText.toLowerCase();

            const matchesSearch = text.includes(search);

            const matchesAgent = !agent || agentName === agent;

            row.style.display = matchesSearch && matchesAgent ? "" : "none";
          });
      }

      function showDetailsFromButton(btn) {
        showDetails(
          btn.dataset.implementation,
          btn.dataset.extension,
          btn.dataset.engine,
          btn.dataset.version,
          btn.dataset.created,
        );
      }
      function showDetails(
        implementation,
        extension,
        engine,
        version,
        created,
      ) {
        document.getElementById("detailsContent").innerHTML = `
          <p><b>Implementation:</b><br>${implementation}</p>

          <p><b>Extension:</b> ${extension}</p>

          <p><b>Engine:</b> ${engine}</p>

          <p><b>Version:</b> ${version}</p>

          <p><b>Created:</b> ${created}</p>
        `;

        document.getElementById("detailsModal").style.display = "block";
      }

      function closeDetails() {
        document.getElementById("detailsModal").style.display = "none";
      }

      window.onclick = function (event) {
        const modal = document.getElementById("detailsModal");

        if (event.target === modal) {
          closeDetails();
        }
      };
    </script>
  </body>
</html>

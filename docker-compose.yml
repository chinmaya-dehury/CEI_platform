services:
  # ──────────────── Consul ────────────────
  consul:
    image: hashicorp/consul:1.21
    container_name: consul
    hostname: consul
    ports:
      - "8500:8500"
    command: "agent -dev -client=0.0.0.0"
    networks:
      - appnet
    restart: unless-stopped

  # ──────────────── Dashboard (Central App) ────────────────
  dashboard:
    build:
      context: .
      dockerfile: dashboard.dockerfile
    container_name: dashboard
    hostname: dashboard
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data           
      - ./central_app.db:/app/central_app.db  
      - ./agents:/app/agents  
    networks:
      - appnet
    depends_on:
      - controller
      - consul
    restart: unless-stopped

  # ──────────────── Controller ────────────────
  controller:
    build:
      context: .
      dockerfile: controller/controller.dockerfile
    container_name: controller
    hostname: controller
    volumes:
      - ./controller:/app
    working_dir: /app
    command: python controller.py
    ports:
      - "9000:9000"
    networks:
      - appnet
    restart: unless-stopped

  # ──────────────── Agent 1 (Traffic) ────────────────
  traffic_agent:
    image: cei/traffic-agent:latest
    build:
      context: .
      dockerfile: Dockerfiles/traffic_agent.dockerfile
    container_name: traffic_agent
    hostname: traffic_agent
    environment:
      - AGENT_HOSTNAME=traffic_agent
    ports:
      - "5000:5000"
    volumes:
      - ./agents/traffic_agent:/app/agents/traffic_agent 
    networks:
      - appnet
    depends_on:
      - controller
      - consul
      - dashboard
    restart: unless-stopped

  traffic_intelligence_service:
    image: cei/traffic-agent:latest
    container_name: traffic_intelligence_service
    hostname: traffic_intelligence_service
    command: python agents/traffic_agent/traffic_main.py
    ports:
      - "5014:5010"
    networks:
      - appnet
    depends_on:
      - traffic_agent
      - dashboard
    restart: unless-stopped

  # ──────────────── Agent 2 (CO2) ────────────────
  co2_agent:
    image: cei/co2-agent:latest
    build:
      context: .
      dockerfile: Dockerfiles/co2_agent.dockerfile
    container_name: co2_agent
    hostname: co2_agent
    environment:
      - AGENT_HOSTNAME=co2_agent
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
    ports:
      - "5001:5001"
    volumes:
      - ./agents/co2_agent:/app/agents/co2_agent 
    networks:
      - appnet
    depends_on:
      - controller
      - consul
      - dashboard
    restart: unless-stopped

  co2_intelligence_service:
    image: cei/co2-agent:latest
    container_name: co2_intelligence_service
    hostname: co2_intelligence_service
    environment:
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
    command: python agents/co2_agent/co2_main.py
    ports:
      - "5010:5010"
    volumes:
      - ./agents/co2_agent:/app/agents/co2_agent
    networks:
      - appnet
    depends_on:
      - co2_agent
      - dashboard
    restart: unless-stopped

  # ──────────────── Agent 3 (Noise) ────────────────
  noise_agent:
    image: cei/noise-agent:latest
    build:
      context: .
      dockerfile: Dockerfiles/noise_agent.dockerfile
    container_name: noise_agent
    hostname: noise_agent
    environment:
      - AGENT_HOSTNAME=noise_agent
    ports:
      - "5002:5002"
    volumes:
      - ./agents/noise_agent:/app/agents/noise_agent 
    networks:
      - appnet
    depends_on:
      - controller
      - consul
      - dashboard
    restart: unless-stopped

  noise_intelligence_service:
    image: cei/noise-agent:latest
    container_name: noise_intelligence_service
    hostname: noise_intelligence_service
    command: python agents/noise_agent/noise_main.py
    ports:
      - "5012:5010"
    networks:
      - appnet
    depends_on:
      - noise_agent
      - dashboard
    restart: unless-stopped

  # ──────────────── Agent 4 (Humidity) ────────────────
  humidity_agent:
    image: cei/humidity-agent:latest
    build:
      context: .
      dockerfile: Dockerfiles/humidity_agent.dockerfile
    container_name: humidity_agent
    hostname: humidity_agent
    environment:
      - AGENT_HOSTNAME=humidity_agent
    ports:
      - "5003:5003"
    volumes:
      - ./agents/humidity_agent:/app/agents/humidity_agent 
    networks:
      - appnet
    depends_on:
      - controller
      - consul
      - dashboard
    restart: unless-stopped

  humidity_intelligence_service:
    image: cei/humidity-agent:latest
    container_name: humidity_intelligence_service
    hostname: humidity_intelligence_service
    command: python agents/humidity_agent/humidity_main.py
    ports:
      - "5011:5010"
    networks:
      - appnet
    depends_on:
      - humidity_agent
      - dashboard
    restart: unless-stopped

  # ──────────────── Agent 5 (Temperature) ────────────────
  temperature_agent:
    image: cei/temperature-agent:latest
    build:
      context: .
      dockerfile: Dockerfiles/temperature_agent.dockerfile
    container_name: temperature_agent
    hostname: temperature_agent
    environment:
      - AGENT_HOSTNAME=temperature_agent
    ports:
      - "5004:5004"
    volumes:
      - ./agents/temperature_agent:/app/agents/temperature_agent 
    networks:
      - appnet
    depends_on:
      - controller
      - consul
      - dashboard
    restart: unless-stopped

  temperature_intelligence_service:
    image: cei/temperature-agent:latest
    container_name: temperature_intelligence_service
    hostname: temperature_intelligence_service
    command: python agents/temperature_agent/temperature_main.py
    ports:
      - "5013:5010"
    networks:
      - appnet
    depends_on:
      - temperature_agent
      - dashboard
    restart: unless-stopped

  # ──────────────── Search Service ────────────────
  search_service:
    build:
      context: .
      dockerfile: search_service/search.dockerfile
    container_name: search_service
    hostname: search_service
    ports:
      - "5006:5006"
    volumes:
      - ./data:/data 
      - ./search_service:/app
    working_dir: /app
    command: python search.py
    networks:
      - appnet
    depends_on:
      - controller
      - consul
      - dashboard
    restart: unless-stopped

networks:
  appnet:
    driver: bridge
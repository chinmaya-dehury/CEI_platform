version: "3.9"

services:
  # ──────────────── Consul ────────────────
  consul:
    image: hashicorp/consul:1.21
    container_name: consul
    ports:
      - "8500:8500"
    command: "agent -dev -client=0.0.0.0"
    networks:
      - appnet

  # ──────────────── Controller ────────────────
  controller:
    build:
      context: .
      dockerfile: controller.dockerfile
    container_name: controller
    volumes:
      - ./server:/app
    working_dir: /app
    command: python controller.py
    ports:
      - "9000:9000"
    networks:
      - appnet

  # ──────────────── Agent 1 ────────────────
  agent1:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile
    container_name: traffic_agent
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data
    networks:
      - appnet
    depends_on:
      - controller
      - consul

  # ──────────────── Agent 2 ────────────────
  co2_agent:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile2.dockerfile
    container_name: co2_agent
    ports:
      - "5001:5001"
    volumes:
      - ./data:/data
    networks:
      - appnet
    depends_on:
      - controller
      - consul

  # ──────────────── Agent 3 ────────────────
  agent3:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile3.dockerfile
    container_name: agent3
    ports:
      - "5002:5002"
    volumes:
      - ./data:/data
    networks:
      - appnet
    depends_on:
      - controller
      - consul

  # ──────────────── Agent 4 ────────────────
  agent4:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile4.dockerfile
    container_name: agent4
    ports:
      - "5003:5003"
    volumes:
      - ./data:/data
    networks:
      - appnet
    depends_on:
      - controller
      - consul

  # ──────────────── Agent 5 ────────────────
  agent5:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile5.dockerfile
    container_name: agent5
    ports:
      - "5004:5004"
    volumes:
      - ./data:/data
    networks:
      - appnet
    depends_on:
      - controller
      - consul

networks:
  appnet:

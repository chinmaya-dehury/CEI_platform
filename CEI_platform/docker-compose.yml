version: "3.9"

services:
  # ──────────────── Consul ────────────────
  consul:
    image: hashicorp/consul:1.21
    container_name: consul
    hostname: consul
    ports:
      - "8500:8500"
    command: "agent -dev -client=0.0.0.0"
    networks:
      - appnet
    restart: unless-stopped

  # ──────────────── Dashboard ────────────────
  dashboard:
    build:
      context: .
      dockerfile: server/dashboard.dockerfile
    container_name: dashboard
    hostname: dashboard
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    networks:
      - appnet
    restart: unless-stopped

  # ──────────────── Controller ────────────────
  controller:
    build:
      context: .
      dockerfile: controller.dockerfile
    container_name: controller
    hostname: controller
    volumes:
      - ./server:/app
    working_dir: /app
    command: python controller.py
    ports:
      - "9000:9000"
    networks:
      - appnet
    restart: unless-stopped

  # ──────────────── Agent 1 ────────────────
  traffic_agent:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile
    container_name: traffic_agent
    hostname: traffic_agent
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data
    networks:
      - appnet
    depends_on:
      - controller
      - consul
    restart: unless-stopped

  # ──────────────── Agent 2 ────────────────
  co2_agent:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile2.dockerfile
    container_name: co2_agent
    hostname: co2_agent
    ports:
      - "5001:5001"
    volumes:
      - ./data:/data
    networks:
      - appnet
    depends_on:
      - controller
      - consul
    restart: unless-stopped

  # ──────────────── Agent 3 ────────────────
  noiseagent:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile3.dockerfile
    container_name: noiseagent
    hostname: noiseagent
    ports:
      - "5002:5002"
    volumes:
      - ./data:/data
    networks:
      - appnet
    depends_on:
      - controller
      - consul
    restart: unless-stopped

  # ──────────────── Agent 4 ────────────────
  humidityagent:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile4.dockerfile
    container_name: humidityagent
    hostname: humidityagent
    ports:
      - "5003:5003"
    volumes:
      - ./data:/data
    networks:
      - appnet
    depends_on:
      - controller
      - consul
    restart: unless-stopped

  # ──────────────── Agent 5 ────────────────
  temperatureagent:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile5.dockerfile
    container_name: temperatureagent
    hostname: temperatureagent
    ports:
      - "5004:5004"
    volumes:
      - ./data:/data
    networks:
      - appnet
    depends_on:
      - controller
      - consul
    restart: unless-stopped

networks:
  appnet:
